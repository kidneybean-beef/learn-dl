Dataset:
  name: "MNIST"
  root_path: "/home/xin/axin/datasets"
  batch_size: 128
  h: 28
  w: 28
  num_workers: 16
  pin_memory: True
Argumentation:
  RandomCrop:
    size: [28, 28]
    padding: 4
  mean: [0.1307]
  std: [0.3081]
Model:
  PlainNet:
    in_channels    : 1
    hidden_channels: 16
    n_blocks_list  : [1, 3, 3, 3]
    stride_list    : [1, 1, 2, 2]
    stride_factor  : 2
    num_classes    : 10
    last_act       : "ReLU"
    conv:
      ResBlock:
        act: "IdentityAct"
        conv1:
          ConvNormAct:
            norm: "BatchNorm"
            act: "ReLU"
            pre_act: True
            conv:
              Conv2d:
                kernel_size: 3
                bias: False
                padding: 1
        conv2:
          ConvNormAct:
            norm: "BatchNorm"
            act: "ReLU"
            pre_act: True
            conv:
              Conv2d:
                kernel_size: 3
                bias: False
                padding: 1
        conv_sc:
          ConvNormAct:
            norm: "BatchNorm"
            act: "ReLU"
            pre_act: True
            conv:
              Conv2d:
                kernel_size: 1
                bias: False
                padding: 0
  OPT:
    SGD:
      lr: 0.1
      momentum: 0.9
      weight_decay: 1e-4
  Scheduler:
    MultiStepLR:
      gamma: 0.1
      milestones: [32000, 48000]
  Init:
    kaiming_normal_:
      mode: "fan_in"
      nonlinearity: "relu"

Train:
  iterations: 1000
  save_freq: 100
  output: "./runs/ResNet/PreResNet_20-Layers_MNIST"
  snapshot: "./runs/ResNet/PreResNet_20-Layers_MNIST/Aug26_01-19-19"
  keep_gradients: False
  device: [0]  # set to [0, 1, ...] for multiple GPUs; set "cpu" for cpu